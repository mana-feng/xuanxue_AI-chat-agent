name: Deploy Frontend-Only to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend-only/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-only/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-only

      - name: Build H5
        run: npm run build:h5
        working-directory: frontend-only

      # 把统计代码注入构建产物，而不是写进仓库源码。
      # 片段存放在仓库级 Secret ANALYTICS_SNIPPET 中（Settings -> Secrets and
      # variables -> Actions -> Repository secrets）。注意必须是 repository
      # secret：本 job 没有声明 environment，挂在 github-pages 环境下的
      # environment secret 在这里取不到，会静默跳过。
      # env 必须留在 step 层，不要提到 job 层，否则 npm ci 等步骤也能读到它。
      - name: Inject analytics snippet
        env:
          ANALYTICS_SNIPPET: ${{ secrets.ANALYTICS_SNIPPET }}
        run: |
          node -e '
          const fs = require("fs");
          const f = "frontend-only/dist/build/h5/index.html";
          const raw = process.env.ANALYTICS_SNIPPET || "";
          if (!raw.trim()) {
            console.log("::warning::ANALYTICS_SNIPPET 未设置或为空，已跳过注入，本次发布的站点不含统计代码");
            process.exit(0);
          }
          const snippet = Buffer.from(raw.replace(/\r\n/g, "\n") + "\n", "utf8");
          const html = fs.readFileSync(f);
          const anchor = Buffer.from("</body>", "utf8");
          const at = html.lastIndexOf(anchor);
          if (at < 0) {
            console.error("FATAL: 未在 " + f + " 中找到 </body>，注入锚点失效");
            process.exit(1);
          }
          fs.writeFileSync(f, Buffer.concat([html.subarray(0, at), snippet, html.subarray(at)]));
          console.log("injected " + snippet.length + " bytes at byte offset " + at);
          '

      - name: Add CNAME
        run: echo "xuan.manafeng.com" > frontend-only/dist/build/h5/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-only/dist/build/h5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
